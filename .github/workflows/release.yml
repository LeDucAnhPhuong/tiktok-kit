name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Quality gates
        run: node scripts/check-all.cjs

      - name: Install smoke test
        run: node scripts/smoke-install.cjs

      # Publishing under `next` until the kit has been exercised end-to-end against a
      # real account. Diagnostic thresholds are uncalibrated; shipping them as `latest`
      # would present provisional numbers as settled to every new installer.
      - name: Publish
        run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
