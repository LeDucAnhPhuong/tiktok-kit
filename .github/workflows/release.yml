name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Quality gates
        run: node scripts/check-all.cjs

      - name: Install smoke test
        run: node scripts/smoke-install.cjs

      # Published to `latest` so the install command in the README works. The 0.x
      # version is the instability signal, not the dist-tag — a first publish under a
      # non-latest tag leaves the package with no `latest` at all, which makes plain
      # `npm install tiktok-kit` fail. Uncalibrated thresholds are disclosed in the
      # README instead.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
